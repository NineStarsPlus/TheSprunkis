<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprunki silly thingy</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- html template -->
    <div id="sprunkis">
      <div id="poloArea" class="area">
        <div id="polo" class="sprunki" data-x="0" data-y="0" data-action="none">
          <div class="sprunkiSprite poloSprite"></div>
          <div class="sprunkiSprite poloSpriteFlip"></div>
        </div>
      </div>

      <div id="simonArea" class="area">
        <div
          id="simon"
          class="sprunki"
          data-x="0"
          data-y="0"
          data-action="none"
        >
          <div id="simonTalk" class="talk"></div>
          <div class="sprunkiSprite simonSprite"></div>
          <div class="sprunkiSprite simonSpriteFlip"></div>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
